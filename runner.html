<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Python Runner</title>
  <!-- Ace Editor CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.32.7/ace.js"></script>
  <!-- Pyodide CDN -->
  <script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 20px; background: #f8f9fa; }
    .container { max-width: 900px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
    #editor { height: 320px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
    .controls { display: flex; align-items: center; gap: 15px; }
    button { padding: 10px 24px; font-size: 15px; font-weight: bold; background: #0d6efd; color: white; border: none; border-radius: 6px; cursor: pointer; }
    button:hover { background: #0b5ed7; }
    button:disabled { background: #6c757d; cursor: not-allowed; }
    #status { font-size: 14px; color: #495057; font-weight: 500; }
    .output-title { margin-top: 10px; margin-bottom: 4px; font-size: 14px; text-transform: uppercase; letter-spacing: 0.5px; color: #6c757d; }
    #output { background: #1e1e1e; color: #00ff66; padding: 16px; border-radius: 6px; min-height: 120px; font-family: "Courier New", Courier, monospace; font-size: 14px; white-space: pre-wrap; overflow-wrap: break-word; border: 1px solid #444; }
    #output.error { color: #ff6b6b; }
  </style>
</head>
<body>

<div class="container">
  <div id="editor"></div>
  
  <div class="controls">
    <button id="run-btn" onclick="runPython()" disabled>Loading Python...</button>
    <span id="status">Initializing Pyodide WebAssembly runtime...</span>
  </div>

  <div class="output-title">Console Output</div>
  <pre id="output">System ready.</pre>
</div>

<script>
  let pyodide;
  let editor;

  async function init() {
    // 1. Initialize Code Editor
    editor = ace.edit("editor");
    editor.setTheme("ace/theme/chrome");
    editor.session.setMode("ace/mode/python");
    editor.setShowPrintMargin(false);

    // 2. Extract code from URL parameters (?code= or ?file=)
    const urlParams = new URLSearchParams(window.location.search);
    let initialCode = "";

    if (urlParams.has('code')) {
      const rawParam = urlParams.get('code');
      try {
        // Try Base64 decoding first
        initialCode = atob(rawParam);
      } catch (e) {
        // Fall back to plain URL decoding
        initialCode = rawParam;
      }
    } else if (urlParams.has('file')) {
      // Fetch code from remote .py file URL
      try {
        const response = await fetch(urlParams.get('file'));
        initialCode = await response.text();
      } catch (e) {
        initialCode = "# Error loading remote script file.";
      }
    } else {
      // Default placeholder code
      initialCode = "# Write your Python code here\nname = input('Enter your name: ')\nprint(f'Hello, {name}!')";
    }

    editor.setValue(initialCode, -1);

    // 3. Load Pyodide WASM Engine & Configure Stdin/Stdout
    try {
      pyodide = await loadPyodide();

      // Set up input handling with proper queue
      window.inputQueue = [];
      
      // Override Python's input() function to use browser prompt
      pyodide.runPython(`
import sys
import builtins

_original_input = builtins.input

def _custom_input(prompt=""):
    import js
    result = js.window.prompt(prompt if prompt else "")
    return result if result is not None else ""

builtins.input = _custom_input
      `);

      document.getElementById('run-btn').disabled = false;
      document.getElementById('run-btn').innerText = "Run Code (Ctrl+Enter)";
      document.getElementById('status').innerText = "Pyodide Ready";
    } catch (err) {
      document.getElementById('status').innerText = "Failed to load WebAssembly.";
      console.error(err);
    }

    // Keyboard shortcut: Ctrl+Enter or Cmd+Enter to run code
    editor.commands.addCommand({
      name: 'runCode',
      bindKey: {win: 'Ctrl-Enter', mac: 'Command-Enter'},
      exec: function() { runPython(); }
    });
  }

  async function runPython() {
    const outputElem = document.getElementById('output');
    outputElem.textContent = '';
    outputElem.classList.remove('error');
    const code = editor.getValue();

    // Redirect print() statements to the HTML output box
    pyodide.setStdout({ write: (text) => { outputElem.textContent += text; } });
    pyodide.setStderr({ write: (text) => { 
      outputElem.classList.add('error');
      outputElem.textContent += text; 
    } });

    try {
      let result = await pyodide.runPythonAsync(code);
      if (result !== undefined) {
        outputElem.textContent += `\n[Result: ${result}]`;
      }
    } catch (err) {
      outputElem.classList.add('error');
      outputElem.textContent += `\nRuntime Error:\n${err.message}`;
    }
  }

  window.onload = init;
</script>
</body>
</html>
