<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Python</title>
  <!-- Ace Editor CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.32.7/ace.js"></script>
  <!-- Pyodide CDN -->
  <script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 20px; background: #f8f9fa; }
    .container { max-width: 1400px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
    .main-layout { display: flex; gap: 12px; flex: 1; }
    .left-panel { flex: 1; display: flex; flex-direction: column; gap: 12px; min-width: 400px; }
    .right-panel { flex: 1; display: flex; flex-direction: column; gap: 12px; min-width: 350px; }
    #editor { height: 320px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
    button { padding: 10px 24px; font-size: 15px; font-weight: bold; background: #0d6efd; color: white; border: none; border-radius: 6px; cursor: pointer; }
    button:hover { background: #0b5ed7; }
    button:disabled { background: #6c757d; cursor: not-allowed; }
    #status { font-size: 11px; color: #adb5bd; font-weight: normal; }
    .output-title { margin-top: 10px; margin-bottom: 4px; font-size: 14px; text-transform: uppercase; letter-spacing: 0.5px; color: #6c757d; }
    #output { background: #1e1e1e; color: #00ff66; padding: 16px; border-radius: 6px; min-height: 120px; font-family: "Courier New", Courier, monospace; font-size: 14px; white-space: pre-wrap; word-wrap: break-word; }
    #output { max-height: 280px; overflow-y: auto; }
    #output:empty::before { content: 'Console is empty. Run some code!'; color: #888; }
    .run-header { color: #8ab4f8; font-weight: bold; border-top: 1px solid #444; margin-top: 10px; padding-top: 8px; }
    .run-header:first-child { border-top: none; margin-top: 0; padding-top: 0; }
    .run-error { color: #ff6b6b; }
    button.small { padding: 4px 12px; font-size: 13px; }
    button.secondary { background: #6c757d; font-weight: normal; padding: 10px 16px; }
    button.secondary:hover { background: #5c636a; }
    #filename { padding: 9px 10px; font-size: 14px; border: 1px solid #ccc; border-radius: 6px; }
    #save-status { color: #198754; }
    #plots { overflow-x: auto; flex: 1; min-height: 150px; }
    .data-row { display: flex; align-items: center; gap: 10px; font-size: 14px; color: #495057; }
    #data-files { font-size: 13px; color: #6c757d; }
    .plots-section { flex: 1; display: flex; flex-direction: column; min-height: 200px; }
    .footer { font-size: 11px; color: #adb5bd; text-align: right; }
    .button-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    #save-status { margin-left: auto; font-size: 12px; }          /* pushes "Saved…" to the right edge */
    #run-count { text-transform: none; letter-spacing: 0; }       /* "(3 runs)" instead of "(3 RUNS)" */
    .main-layout .output-title { margin-top: 0; }                 /* both panel titles line up at the top */
    .bottom-bar { border-top: 1px solid #dee2e6; padding-top: 10px; display: flex; flex-direction: column; gap: 6px; }
  </style>
</head>
<body>

<div class="container">

  <div class="main-layout">

    <div class="left-panel">
      <div class="output-title">Code Editor</div>
      <div id="editor"></div>
      <div class="button-row">
        <button id="run-btn" onclick="runPython()" disabled>Loading Python...</button>
        <button id="save-btn" class="secondary" onclick="downloadPy()">Save as .py</button>
        <input id="filename" type="text" value="my_script" aria-label="File name" size="14">
        <button id="reset-btn" class="secondary" onclick="resetCode()">Reset code</button>
        <span id="save-status"></span>
      </div>
    </div>

    <div class="right-panel">
      <div class="output-title">Console Output <span id="run-count"></span></div>
      <pre id="output"></pre>
      <div class="button-row">
        <button class="secondary small" onclick="clearConsole()">Clear console</button>
      </div>

      <div class="plots-section">
        <div class="output-title">Plots</div>
        <div id="plots"></div>
      </div>
    </div>

  </div>

  <div class="bottom-bar">
    <div class="data-row">
      <label for="data-file">Add data file(s):</label>
      <input id="data-file" type="file" accept=".csv,.tsv,.txt,.dat" multiple>
    </div>
    <div id="data-files"></div>
    <div class="footer"><span id="status">Initializing...</span> · runner v1.4 (2026-10-06)</div>
  </div>

</div>

<script>
  let pyodide;
  let editor;
  let starterCode = '';
  let storageKey = '';
  let saveTimer;

  let runCount = 0;
  const RUN_TIMEOUT_SECONDS = 10;
  
  function appendRun(text, isError) {
    const MAX_CHARS = 20000;
    if (text.length > MAX_CHARS) text = text.slice(0, MAX_CHARS) + '\n... output truncated ...';
    const out = document.getElementById('output');
  
    const header = document.createElement('div');
    header.className = 'run-header';
    header.textContent = `Run #${runCount}  ·  ${new Date().toLocaleTimeString()}`;
  
    const body = document.createElement('div');
    if (isError) body.className = 'run-error';
    body.textContent = text.replace(/\n+$/, '');      // drop trailing blank lines
  
    out.appendChild(header);
    out.appendChild(body);
  
    while (out.children.length > 100) out.removeChild(out.firstChild);  // keep at most 50 runs
    out.scrollTop = out.scrollHeight;                                    // jump to newest output
  
    document.getElementById('run-count').textContent =
      `(${runCount} run${runCount === 1 ? '' : 's'})`;
  }
  
  function clearConsole() {
    runCount = 0;
    document.getElementById('output').innerHTML = '';
    document.getElementById('run-count').textContent = '';
    document.getElementById('plots').innerHTML = '';
  }
  
  // Tiny hash so a long ?code= value doesn't become a giant storage key
  function hashString(s) {
    let h = 0;
    for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0;
    return (h >>> 0).toString(36);
  }
  
  // One storage slot per exercise: page path + which starter code was requested
  function makeStorageKey(params) {
    let id = 'default';
    if (params.has('file')) id = 'file:' + params.get('file');
    else if (params.has('code')) id = 'code:' + hashString(params.get('code'));
    return 'pyrunner:' + location.pathname + ':' + id;
  }
  
  function loadSaved() {
    try { return localStorage.getItem(storageKey); }
    catch (e) { return null; }           // storage blocked (private mode, iframe, etc.)
  }
  
  function saveNow() {
    const el = document.getElementById('save-status');
    try {
      localStorage.setItem(storageKey, editor.getValue());
      el.textContent = 'Saved ' + new Date().toLocaleTimeString();
    } catch (e) {
      el.textContent = 'Auto-save unavailable: use Save as .py';
    }
  }
  
  function scheduleSave() {              // wait 0.5 s after the last keystroke
    clearTimeout(saveTimer);
    saveTimer = setTimeout(saveNow, 500);
  }
  
  function resetCode() {
    if (confirm('Replace your code with the original starter code? This cannot be undone.')) {
      editor.setValue(starterCode, -1);
      saveNow();
    }
  }
  function downloadPy() {
    let name = document.getElementById('filename').value.trim() || 'my_script';
    name = name.replace(/\.py$/i, '').replace(/[^\w\-]+/g, '_') + '.py';
  
    const blob = new Blob([editor.getValue()], { type: 'text/x-python;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }
  
  const loadedFiles = [];

  function listFiles() {
    document.getElementById('data-files').textContent = loadedFiles.length
      ? 'Files available to Python: ' + loadedFiles.join(', ')
      : 'No data files loaded.';
  }
  
  // Write bytes into Pyodide's virtual file system, in Python's working directory
  function addFileToPyodide(name, bytes) {
    const dir = pyodide.runPython('import os; os.getcwd()');
    pyodide.FS.writeFile(`${dir}/${name}`, bytes);
    if (!loadedFiles.includes(name)) loadedFiles.push(name);
    listFiles();
  }
  
  async function handleFileUpload(event) {
    if (!pyodide) {
      alert('Python is still loading. Try again in a moment.');
      event.target.value = '';
      return;
    }
    for (const file of event.target.files) {
      const bytes = new Uint8Array(await file.arrayBuffer());
      const safeName = file.name.replace(/[^\w.\-]+/g, '_');   // spaces etc. become _
      addFileToPyodide(safeName, bytes);
    }
    event.target.value = '';   // lets the same file be chosen again after editing it
  }

  async function init() {
    editor = ace.edit("editor");
    editor.setTheme("ace/theme/chrome");
    editor.session.setMode("ace/mode/python");
    editor.setShowPrintMargin(false);

    const urlParams = new URLSearchParams(window.location.search);
    let initialCode = "";

    if (urlParams.has('code')) {
      const rawParam = urlParams.get('code');
      try {
        initialCode = atob(rawParam);
      } catch (e) {
        initialCode = rawParam;
      }
    } else if (urlParams.has('file')) {
      try {
        const response = await fetch(urlParams.get('file'));
        initialCode = await response.text();
      } catch (e) {
        initialCode = "# Error loading remote script file.";
      }
    } else {
      initialCode = "# Write your Python code here\n";
    }

    starterCode = initialCode;
    storageKey = makeStorageKey(urlParams);
    const saved = loadSaved();
    editor.setValue(saved !== null ? saved : starterCode, -1);
    
    // Attach AFTER the first setValue so loading doesn't trigger a save
    editor.session.on('change', scheduleSave);
    window.addEventListener('pagehide', saveNow);   // last-chance save as the tab closes
    
    // Tell Pyodide's matplotlib where to draw figures
    document.pyodideMplTarget = document.getElementById('plots');
    document.getElementById('data-file').addEventListener('change', handleFileUpload);
    listFiles();
    
    try {
      pyodide = await loadPyodide();
      document.getElementById('run-btn').disabled = false;
      document.getElementById('run-btn').innerText = "Run Code (Ctrl+Enter)";
      document.getElementById('status').innerText = "Pyodide Ready";
    } catch (err) {
      document.getElementById('status').innerText = "Failed to load WebAssembly.";
      console.error(err);
    }

    editor.commands.addCommand({
      name: 'runCode',
      bindKey: {win: 'Ctrl-Enter', mac: 'Command-Enter'},
      exec: function() { runPython(); }
    });
    editor.commands.addCommand({
      name: 'savePy',
      bindKey: {win: 'Ctrl-S', mac: 'Command-S'},
      exec: function() { downloadPy(); }
    });
  }
  async function runPython() {
    const plotsElem = document.getElementById('plots');
    const statusElem = document.getElementById('status');
    const runBtn = document.getElementById('run-btn');
  
    if (!pyodide) {
      statusElem.innerText = 'Pyodide is not ready yet.';
      return;
    }
  
    runCount++;                // count every run, including ones that end in an error
    plotsElem.innerHTML = '';  // plots still show only the latest run (see note below)
    const code = editor.getValue();
  
    runBtn.disabled = true;
    runBtn.innerText = 'Running...';
    try {
      statusElem.innerText = 'Checking libraries (first use can take a while)...';
      await pyodide.loadPackagesFromImports(code);
      statusElem.innerText = 'Running...';
  
      pyodide.globals.set('user_code', code);
      pyodide.globals.set('run_limit', RUN_TIMEOUT_SECONDS);
  
      const output = await pyodide.runPythonAsync(`
  import sys, io, time, builtins
  from js import prompt as js_prompt
  
  class RunTimeout(BaseException):
      pass
  
  deadline = [0.0]                      # a list, so input() can push the deadline back
  
  def make_tracer(limit):
      deadline[0] = time.time() + limit
      def tracer(frame, event, arg):
          if time.time() > deadline[0]:
              raise RunTimeout(f'Your code was stopped after {limit} seconds. Is there an infinite loop?')
          if frame.f_code.co_filename == '<user_code>':
              return tracer          # check on every line of the student's own code
          return None                # don't line-trace inside libraries (much faster)
      return tracer
  
  def student_input(message=''):
      message = str(message)
      started = time.time()
      reply = js_prompt(message or 'Python is asking for input:')
      deadline[0] += time.time() - started        # time spent typing doesn't count
      if reply is None:                           # the student pressed Cancel
          raise KeyboardInterrupt('Input cancelled')
      print(message + reply)                      # echo it into the console output
      return reply
  
  original_input = builtins.input
  builtins.input = student_input
  
  old_stdout = sys.stdout
  sys.stdout = stdout_buffer = io.StringIO()
  
  try:
      sys.settrace(make_tracer(run_limit))
      exec(compile(user_code, '<user_code>', 'exec'), {'__name__': '__main__'})
  finally:
      sys.settrace(None)
      builtins.input = original_input
      sys.stdout = old_stdout
  
  stdout_buffer.getvalue()
      `);
  
      appendRun(output || '(Code executed with no output)', false);
    } catch (err) {
      appendRun(`Error:\n${err.stack || err.message || String(err)}`, true);
    } finally {
      runBtn.disabled = false;
      runBtn.innerText = 'Run Code (Ctrl+Enter)';
      statusElem.innerText = 'Pyodide ' + pyodide.version + ' ready';
    }
  }
    

  window.onload = init;
</script>
</body>
</html>
