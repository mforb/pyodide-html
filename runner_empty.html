<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Python Runner</title>
  <!-- Ace Editor CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.32.7/ace.js"></script>
  <!-- Pyodide CDN -->
  <script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f8f9fa;
    }
    .container { max-width: 900px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
    #editor { height: 320px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
    .controls { display: flex; align-items: center; gap: 15px; flex-wrap: wrap; }
    button { padding: 10px 24px; font-size: 15px; font-weight: bold; background: #0d6efd; color: white; border: none; border-radius: 6px; cursor: pointer; }
    button:hover { background: #0b5ed7; }
    button:disabled { background: #6c757d; cursor: not-allowed; }
    #status { font-size: 14px; color: #495057; font-weight: 500; }
    .output-title { margin-top: 10px; margin-bottom: 4px; font-size: 14px; text-transform: uppercase; letter-spacing: 0.5px; color: #6c757d; }
    #output { background: #1e1e1e; color: #00ff66; padding: 16px; border-radius: 6px; min-height: 120px; font-family: "Courier New", Courier, monospace; font-size: 14px; white-space: pre-wrap; overflow-y: auto; }
    #output { max-height: 280px; overflow-y: auto; }
    #output:empty::before { content: 'Console is empty. Run some code!'; color: #888; }
    .run-header { color: #8ab4f8; font-weight: bold; border-top: 1px solid #444; margin-top: 10px; padding-top: 8px; }
    .run-header:first-child { border-top: none; margin-top: 0; padding-top: 0; }
    .run-error { color: #ff6b6b; }
    .output-header { display: flex; justify-content: space-between; align-items: flex-end; }
    button.small { padding: 4px 12px; font-size: 13px; }
    button.secondary { background: #6c757d; font-weight: normal; padding: 10px 16px; }
    button.secondary:hover { background: #5c636a; }
    #save-status { color: #198754; }
  </style>
</head>
<body>

<div class="container">
  <div id="editor"></div>

  <div class="controls">
    <button id="run-btn" onclick="runPython()" disabled>Loading Python...</button>
    <button id="reset-btn" class="secondary" onclick="resetCode()">Reset code</button>
    <span id="save-status"></span>
    <span id="status">Initializing Pyodide WebAssembly runtime...</span>
  </div>

  <div class="output-title">Console Output <span id="run-count"></span></div>
  <pre id="output"></pre>
  <div class="controls">
    <button class="secondary small" onclick="clearConsole()">Clear console</button>
  </div>
</div>

<script>
  let pyodide;
  let editor;
  let starterCode = '';
  let storageKey = '';
  let saveTimer;
  let runCount = 0;

  const MAX_OUTPUT_SIZE = 50000;
  const RUN_TIMEOUT_SECONDS = 5;

  function appendRun(text, isError) {
    const out = document.getElementById('output');

    const header = document.createElement('div');
    header.className = 'run-header';
    header.textContent = `Run #${runCount}  ·  ${new Date().toLocaleTimeString()}`;

    const body = document.createElement('div');
    if (isError) body.className = 'run-error';

    if (typeof text !== 'string') text = String(text);
    if (text.length > MAX_OUTPUT_SIZE) {
      text = text.slice(0, MAX_OUTPUT_SIZE) + '\n\n[Output truncated - exceeded maximum size of ' + MAX_OUTPUT_SIZE + ' characters]';
    }

    body.textContent = text.replace(/\n+$/, '');

    out.appendChild(header);
    out.appendChild(body);

    while (out.children.length > 100) out.removeChild(out.firstChild);
    out.scrollTop = out.scrollHeight;

    document.getElementById('run-count').textContent =
      `(${runCount} run${runCount === 1 ? '' : 's'})`;
  }

  function clearConsole() {
    runCount = 0;
    document.getElementById('output').innerHTML = '';
    document.getElementById('run-count').textContent = '';
  }

  function hashString(s) {
    let h = 0;
    for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0;
    return (h >>> 0).toString(36);
  }

  function makeStorageKey(params) {
    let id = 'default';
    if (params.has('file')) id = 'file:' + params.get('file');
    else if (params.has('code')) id = 'code:' + hashString(params.get('code'));
    return 'pyrunner:' + location.pathname + ':' + id;
  }

  function loadSaved() {
    try { return localStorage.getItem(storageKey); }
    catch (e) { return null; }
  }

  function saveNow() {
    const el = document.getElementById('save-status');
    try {
      localStorage.setItem(storageKey, editor.getValue());
      el.textContent = 'Saved ' + new Date().toLocaleTimeString();
    } catch (e) {
      el.textContent = 'Auto-save unavailable';
    }
  }

  function scheduleSave() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(saveNow, 500);
  }

  function resetCode() {
    if (confirm('Replace your code with the original starter code? This cannot be undone.')) {
      editor.setValue(starterCode, -1);
      saveNow();
    }
  }

  async function init() {
    editor = ace.edit('editor');
    editor.setTheme('ace/theme/chrome');
    editor.session.setMode('ace/mode/python');
    editor.setShowPrintMargin(false);

    const urlParams = new URLSearchParams(window.location.search);
    let initialCode = '';

    if (urlParams.has('code')) {
      const rawParam = urlParams.get('code');
      try {
        initialCode = atob(rawParam);
      } catch (e) {
        initialCode = rawParam;
      }
    } else if (urlParams.has('file')) {
      try {
        const response = await fetch(urlParams.get('file'));
        initialCode = await response.text();
      } catch (e) {
        initialCode = '# Error loading remote script file.';
      }
    } else {
      initialCode = "# Write your Python code here";
    }

    starterCode = initialCode;
    storageKey = makeStorageKey(urlParams);
    const saved = loadSaved();
    editor.setValue(saved !== null ? saved : starterCode, -1);

    editor.session.on('change', scheduleSave);
    window.addEventListener('pagehide', saveNow);

    try {
      pyodide = await loadPyodide();
      document.getElementById('run-btn').disabled = false;
      document.getElementById('run-btn').innerText = 'Run Code (Ctrl+Enter)';
      document.getElementById('status').innerText = 'Pyodide Ready';
    } catch (err) {
      document.getElementById('status').innerText = 'Failed to load WebAssembly.';
      console.error(err);
    }

    editor.commands.addCommand({
      name: 'runCode',
      bindKey: {win: 'Ctrl-Enter', mac: 'Command-Enter'},
      exec: function() { runPython(); }
    });
  }

  async function runPython() {
    const statusElem = document.getElementById('status');
    const runBtn = document.getElementById('run-btn');

    if (!pyodide) {
      statusElem.innerText = 'Pyodide is not ready yet.';
      return;
    }

    runCount++;
    const code = editor.getValue();
    runBtn.disabled = true;

    try {
      statusElem.innerText = 'Checking libraries (first use can take a while)...';
      await pyodide.loadPackagesFromImports(code);
      statusElem.innerText = 'Running...';

      pyodide.globals.set('user_code', code);
      pyodide.globals.set('run_limit', RUN_TIMEOUT_SECONDS);

      const output = await pyodide.runPythonAsync(`
import sys, io, time, builtins
from js import prompt as js_prompt

class RunTimeout(BaseException):
    pass

deadline = [0.0]                      # a list, so input() can push the deadline back

def make_tracer(limit):
    deadline[0] = time.time() + limit
    def tracer(frame, event, arg):
        if time.time() > deadline[0]:
            raise RunTimeout(f'Your code was stopped after {limit} seconds. Is there an infinite loop?')
        if frame.f_code.co_filename == '<user_code>':
            return tracer          # check on every line of the student's own code
        return None                # don't line-trace inside libraries (much faster)
    return tracer

def student_input(message=''):
    message = str(message)
    started = time.time()
    reply = js_prompt(message or 'Python is asking for input:')
    deadline[0] += time.time() - started        # time spent typing doesn't count
    if reply is None:                           # the student pressed Cancel
        raise KeyboardInterrupt('Input cancelled')
    print(message + reply)                      # echo it into the console output
    return reply

original_input = builtins.input
builtins.input = student_input

old_stdout = sys.stdout
sys.stdout = stdout_buffer = io.StringIO()

try:
    sys.settrace(make_tracer(run_limit))
    exec(compile(user_code, '<user_code>', 'exec'), {'__name__': '__main__'})
finally:
    sys.settrace(None)
    builtins.input = original_input
    sys.stdout = old_stdout

stdout_buffer.getvalue()
      `);

      appendRun(output || '(Code executed with no output)', false);
    } catch (err) {
      appendRun(`Error:\n${err.stack || err.message || String(err)}`, true);
    } finally {
      runBtn.disabled = false;
      statusElem.innerText = 'Pyodide Ready';
    }
  }

  window.onload = init;
</script>
</body>
</html>
