<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pyodide Python Class</title>
    <script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            padding: 30px;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            text-align: center;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .editor-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .section {
            display: flex;
            flex-direction: column;
        }

        .section h2 {
            font-size: 16px;
            color: #333;
            margin-bottom: 10px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 8px;
        }

        textarea {
            flex: 1;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            resize: none;
            min-height: 300px;
        }

        #code {
            background-color: #f9f9f9;
        }

        #output {
            background-color: #1e1e1e;
            color: #00ff00;
            padding: 12px;
            border-radius: 5px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            border: 1px solid #333;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            justify-content: center;
        }

        button {
            padding: 12px 24px;
            font-size: 14px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        #runBtn {
            background-color: #667eea;
            color: white;
        }

        #runBtn:hover:not(:disabled) {
            background-color: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        #runBtn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #clearBtn {
            background-color: #e0e0e0;
            color: #333;
        }

        #clearBtn:hover {
            background-color: #d0d0d0;
        }

        .status {
            text-align: center;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 20px;
            font-weight: 500;
            display: none;
        }

        .status.loading {
            background-color: #fff3cd;
            color: #856404;
            display: block;
        }

        .status.ready {
            background-color: #d4edda;
            color: #155724;
            display: block;
        }

        .status.error {
            background-color: #f8d7da;
            color: #721c24;
            display: block;
        }

        @media (max-width: 768px) {
            .editor-section {
                grid-template-columns: 1fr;
            }

            textarea {
                min-height: 200px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🐍 Pyodide Python Class</h1>
        <p class="subtitle">Run Python code directly in your browser</p>

        <div id="status" class="status loading">Initializing Pyodide... (this may take a moment on first load)</div>

        <div class="button-group">
            <button id="runBtn" onclick="runCode()" disabled>Run Code</button>
            <button id="clearBtn" onclick="clearOutput()">Clear Output</button>
        </div>

        <div class="editor-section">
            <div class="section">
                <h2>Python Code Editor</h2>
                <textarea id="code" placeholder="Write your Python code here...&#10;&#10;Example:&#10;print('Hello, World!')&#10;x = 5 + 3&#10;print(f'5 + 3 = {x}')">print('Hello from Pyodide!')
</textarea>
            </div>
            <div class="section">
                <h2>Output</h2>
                <div id="output"></div>
            </div>
        </div>
    </div>

    <script>
        let pyodide;
        let outputBuffer = "";

        async function initPyodide() {
            try {
                document.getElementById("status").className = "status loading";
                document.getElementById("status").textContent = "Initializing Pyodide... (this may take a moment on first load)";
                
                pyodide = await loadPyodide();
                
                // Set up output redirection
                pyodide.runPython(`
import sys
from io import StringIO

class OutputCapture(StringIO):
    def __init__(self, callback):
        super().__init__()
        self.callback = callback
    
    def write(self, text):
        self.callback(text)
        return super().write(text)

_output_buffer = []

def _capture_output(text):
    _output_buffer.append(text)

sys.stdout = OutputCapture(_capture_output)
sys.stderr = OutputCapture(_capture_output)
                `);
                
                document.getElementById("status").className = "status ready";
                document.getElementById("status").textContent = "✓ Pyodide is ready! You can now run Python code.";
                document.getElementById("runBtn").disabled = false;
            } catch (error) {
                document.getElementById("status").className = "status error";
                document.getElementById("status").textContent = "✗ Error initializing Pyodide: " + error.message;
            }
        }

        async function runCode() {
            const code = document.getElementById("code").value;
            const outputDiv = document.getElementById("output");

            if (!pyodide) {
                outputDiv.textContent = "Pyodide is not initialized yet. Please wait...";
                return;
            }

            try {
                document.getElementById("runBtn").disabled = true;
                outputDiv.textContent = "Running...\n";
                
                // Clear the output buffer
                pyodide.runPython("_output_buffer.clear()");
                
                // Run the user code
                await pyodide.runPythonAsync(code);
                
                // Get the captured output
                const output = pyodide.runPython("''.join(_output_buffer)");
                
                if (output) {
                    outputDiv.textContent = output;
                } else {
                    outputDiv.textContent = "(Code ran with no output)";
                }
                
                document.getElementById("runBtn").disabled = false;
            } catch (error) {
                outputDiv.textContent = "Error:\n" + error.message;
                document.getElementById("runBtn").disabled = false;
            }
        }

        function clearOutput() {
            document.getElementById("output").textContent = "";
        }

        // Initialize Pyodide when the page loads
        window.addEventListener("load", initPyodide);
    </script>
</body>
</html>
